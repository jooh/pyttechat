repos:
  - repo: local
    hooks:
      - id: fmt-check
        name: gofmt check
        entry: make fmt-check
        language: system
        pass_filenames: false
      - id: tidy-check
        name: go mod tidy check
        entry: make tidy-check
        language: system
        pass_filenames: false
      - id: mod-verify
        name: Go module cache verification
        entry: make mod-verify
        language: system
        pass_filenames: false
      - id: modernize-check
        name: Go modernizer check
        entry: make modernize-check
        language: system
        pass_filenames: false
      - id: lint-fast
        name: fast Go lint
        entry: make lint-fast
        language: system
        pass_filenames: false
      - id: test
        name: Go unit tests
        entry: make test
        language: system
        pass_filenames: false
