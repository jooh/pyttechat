<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="csrf-token" content="{{.CSRFToken}}">
    <title>{{.Title}} - Pyttechat</title>
    <script src="/assets/theme-init.js"></script>
    <link rel="stylesheet" href="/assets/vendor/pico.min.css">
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-panel" aria-labelledby="auth-title">
        <h1 id="auth-title">{{.Title}}</h1>
        {{if .Error}}<p class="auth-error" role="alert">{{.Error}}</p>{{end}}
        <form method="post" action="{{.Action}}" class="auth-form">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="{{if eq .Action "/register"}}new-password{{else}}current-password{{end}}" required>
          <button type="submit">{{.SubmitLabel}}</button>
        </form>
        {{if eq .Action "/login"}}
          {{if .RegistrationEnabled}}<p class="auth-switch"><a href="/register">Create account</a></p>{{end}}
        {{else}}
          <p class="auth-switch"><a href="/login">Sign in</a></p>
        {{end}}
      </section>
    </main>
  </body>
</html>
