<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="csrf-token" content="{{.CSRFToken}}">
    <title>Pyttechat</title>
    <script src="/assets/theme-init.js"></script>
    <link rel="stylesheet" href="/assets/vendor/pico.min.css">
    <link rel="stylesheet" href="/assets/vendor/katex/katex.min.css">
    <link rel="stylesheet" href="/assets/app.css">
    <script defer src="/assets/vendor/katex/katex.min.js"></script>
    <script defer src="/assets/vendor/katex/auto-render.min.js"></script>
    <script defer src="/assets/vendor/mermaid.min.js"></script>
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Pyttechat</h1>
          <p class="topbar-subtitle">Server-rendered chat</p>
        </div>
        <div class="topbar-actions">
          <div class="model-chip" aria-label="Active model">
            <span class="model-chip-label">Model</span>
            <span class="model-chip-value">{{.ModelLabel}}</span>
          </div>
          <button id="theme-toggle" class="theme-toggle" type="button" data-theme-toggle aria-label="Current theme: system preference">
            <svg data-theme-icon="light" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
            <svg data-theme-icon="dark" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M21 12.8A8 8 0 1 1 11.2 3 6.2 6.2 0 0 0 21 12.8z"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="chat-panel" aria-label="Chat messages">
        <div id="messages" class="messages" aria-live="polite">
          {{range .Messages}}
            <article class="message message-{{.Role}}">
              {{range .Statuses}}
                <div class="message-status" data-status-kind="{{.Kind}}" data-status-state="complete">
                  <button class="message-status-toggle" type="button" data-status-toggle aria-expanded="false" aria-controls="{{.ContentID}}">{{.Label}}</button>
                  <div id="{{.ContentID}}" class="message-status-content" hidden>{{.Text}}</div>
                </div>
              {{end}}
              {{if eq .Role "assistant"}}
                <div class="message-text markdown-body">{{.HTML}}</div>
              {{else if .HTML}}
                <div class="message-text markdown-body">{{.HTML}}</div>
              {{else}}
                <div class="message-text message-plain">{{.Text}}</div>
              {{end}}
              <div class="message-actions" aria-label="Message actions">
                <button class="message-action" type="button" data-copy-message aria-label="Copy message">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M8 7h10v13H8z"></path>
                    <path d="M6 17H4V3h12v2"></path>
                  </svg>
                  <span class="sr-only">Copy message</span>
                </button>
              </div>
            </article>
          {{else}}
            <article class="message message-empty">
              <div class="message-text message-plain">Start a conversation.</div>
            </article>
          {{end}}
          <div id="messages-end" class="messages-end" aria-hidden="true"></div>
        </div>
        <button id="scroll-bottom" class="scroll-bottom" type="button" aria-label="Scroll to latest message" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>
      </section>

      <form id="chat-form" class="composer" aria-label="Chat composer">
        <div class="composer-box">
          <label class="sr-only" for="prompt">Message</label>
          <textarea id="prompt" name="prompt" rows="1" autocomplete="off" placeholder="Type a message"></textarea>
          <div class="composer-controls">
            <p id="composer-status" class="composer-status" aria-live="polite">Ready</p>
            <button id="stop-button" class="icon-button stop-button" type="button" disabled aria-label="Stop response">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M8 8h8v8H8z"></path>
              </svg>
              <span class="sr-only">Stop</span>
            </button>
            <button id="send-button" class="icon-button send-button" type="submit" aria-label="Send message">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M5 12h14"></path>
                <path d="m13 6 6 6-6 6"></path>
              </svg>
              <span class="sr-only">Send</span>
            </button>
          </div>
        </div>
      </form>
    </main>
  </body>
</html>
