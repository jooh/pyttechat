name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    name: Native Go fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Fuzz untrusted input boundaries
        run: make fuzz FUZZ_TIME=1m

      - name: Upload crash corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-corpus
          path: |
            internal/markdown/testdata/fuzz
            internal/llm/openresponses/testdata/fuzz
          if-no-files-found: ignore
