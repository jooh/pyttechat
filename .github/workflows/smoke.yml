name: Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run container smoke test
        run: make container-smoke
